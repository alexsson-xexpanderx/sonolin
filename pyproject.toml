[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonolin"
version = "0.1.0"
description = "A Python Sonos controller: UPnP and the local WebSocket API behind one object"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = ["soco>=0.30", "aiohttp>=3.9"]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]

[project.scripts]
sonolin = "sonolin.cli:main"
sonolin-gui = "sonolin.gui:main"

[tool.setuptools.packages.find]
include = ["sonolin*"]

[tool.setuptools.package-data]
"sonolin.gui" = ["theme_files/*.json", "sonolin.svg"]
